name: Publicar cumpleanos en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar el sitio
        run: |
          mkdir site
          cp index.html styles.css mobile.css Confeti.js Confeti2.js Sorpresa.js site/
          cp -R recursos site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4